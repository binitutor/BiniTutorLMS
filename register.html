<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BiniTutor</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, #1a3644 100%);
            padding: 2rem 0;
        }
        
        .register-card {
            max-width: 500px;
            width: 100%;
            margin: 2rem;
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .register-header h2 {
            color: var(--primary-color);
            font-weight: 700;
        }
        
        .social-login {
            display: grid;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            background: var(--bg-secondary);
            transform: translateY(-2px);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        
        .divider span {
            padding: 0 1rem;
            color: var(--text-secondary);
        }
        
        .password-strength {
            height: 5px;
            margin-top: 0.5rem;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="card">
                <div class="card-body p-4">
                    <div class="register-header">
                        <h2><i class="bi bi-book-fill text-primary-custom"></i> BiniTutor</h2>
                        <h3>Create Account</h3>
                        <p class="text-muted">Start your learning journey today</p>
                    </div>

                    <!-- Social Register -->
                    <div class="social-login">
                        <button class="social-btn" onclick="socialRegister('Google')">
                            <i class="bi bi-google"></i>
                            <span>Sign up with Google</span>
                        </button>
                        <button class="social-btn" onclick="socialRegister('Facebook')">
                            <i class="bi bi-facebook"></i>
                            <span>Sign up with Facebook</span>
                        </button>
                    </div>

                    <div class="divider">
                        <span>OR</span>
                    </div>

                    <!-- Register Form -->
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" placeholder="Create a password" required onkeyup="checkPasswordStrength()">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                            <div class="password-strength">
                                <div class="password-strength-bar" id="strengthBar"></div>
                            </div>
                            <small class="text-muted" id="strengthText">Password strength: None</small>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">I want to:</label>
                            <select class="form-select" id="role" required>
                                <option value="">Select your role</option>
                                <option value="student">Learn (Student)</option>
                                <option value="instructor">Teach (Instructor)</option>
                            </select>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label" for="terms">
                                I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="login.html" class="text-decoration-none fw-bold">Login</a></p>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <a href="index.html" class="text-white text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const terms = document.getElementById('terms').checked;
            
            if (!terms) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Terms Required',
                    text: 'Please accept the Terms of Service and Privacy Policy',
                    confirmButtonColor: '#234756'
                });
                return;
            }
            
            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Password Mismatch',
                    text: 'Passwords do not match. Please try again.',
                    confirmButtonColor: '#234756'
                });
                return;
            }
            
            if (password.length < 8) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Weak Password',
                    text: 'Password must be at least 8 characters long',
                    confirmButtonColor: '#234756'
                });
                return;
            }
            
            Swal.fire({
                icon: 'success',
                title: 'Registration Successful!',
                text: 'Welcome to BiniTutor! Redirecting to your dashboard...',
                confirmButtonColor: '#234756',
                timer: 2000,
                timerProgressBar: true
            }).then(() => {
                if (role === 'instructor') {
                    window.location.href = 'instructor-dashboard.html';
                } else {
                    window.location.href = 'student-dashboard.html';
                }
            });
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }

        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            let color, text, width;
            
            if (strength === 0) {
                color = 'transparent';
                text = 'None';
                width = '0%';
            } else if (strength <= 2) {
                color = '#dc3545';
                text = 'Weak';
                width = '33%';
            } else if (strength <= 3) {
                color = '#ffc107';
                text = 'Medium';
                width = '66%';
            } else {
                color = '#28a745';
                text = 'Strong';
                width = '100%';
            }
            
            strengthBar.style.width = width;
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = 'Password strength: ' + text;
        }

        function socialRegister(provider) {
            Swal.fire({
                icon: 'info',
                title: provider + ' Sign Up',
                text: 'Redirecting to ' + provider + ' authentication...',
                confirmButtonColor: '#234756',
                timer: 2000
            });
        }
    </script>
</body>
</html>
